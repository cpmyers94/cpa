name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/paycheck-planner-rebuild-7le3gl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /cpa
          NEXT_PUBLIC_SUPABASE_URL: https://pzrmmqwjtomksltujqfp.supabase.co
          # Anon key — public by design; data is protected by Supabase row-level security.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6cm1tcXdqdG9ta3NsdHVqcWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5Nzc0NTgsImV4cCI6MjA5OTU1MzQ1OH0.ey2FeIK6WyiR1_JhBSYa17D8dc4yp7wxSuKDKyO8afA

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
